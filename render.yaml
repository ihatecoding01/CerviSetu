services:
  - type: web
    name: cervisetu-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.dashboard.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/facilities
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CERVISETU_STAFF_AUTH
        value: "1"
      - key: CERVISETU_STAFF_DEMO_PIN
        value: "246810"
      - key: CERVISETU_STAFF_DEMO_SIGNIN
        value: "1"
      - key: CERVISETU_ENV
        value: development
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: VAULT_SECRET_KEY
        generateValue: true
