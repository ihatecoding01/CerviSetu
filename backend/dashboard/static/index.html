  <body>
    <div id="root"><div id="boot" style="font:14px system-ui;color:#64748b;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px">Loading CerviSetu...</div></div>
    <script>
      // Visible even if the app's code cannot load or crashes before it starts
      (function () {
        function show(detail) {
          var el = document.getElementById("boot");
          if (!el) return;
          el.innerHTML = '<div>CerviSetu could not load.<br><button onclick="location.reload()" style="margin:12px 0;padding:8px 16px;border-radius:99px;background:#000;color:#fff;border:0;cursor:pointer">Reload</button><pre id="boot-detail" style="font-size:12px;white-space:pre-wrap"></pre></div>';
          document.getElementById("boot-detail").textContent = detail || "";
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          show(e.message || (t && (t.src || t.href) ? "Could not load " + (t.src || t.href) : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
        setTimeout(function () { show("The app took too long to start."); }, 15000);
      })();
    </script>
  </body>
